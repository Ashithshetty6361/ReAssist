name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: "ollama"  # Use ollama provider (tests are mocked)
      EMBEDDING_PROVIDER: "huggingface"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pytest

    - name: Lint with ruff
      run: |
        ruff check src/ --select E,F,W --ignore E501

    - name: Run unit tests
      run: |
        pytest tests/test_router.py tests/test_setup.py tests/test_agents.py tests/test_services.py -v
